const lin=v=>(v/=255)<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);
function rgb2lab([r,g,b]){r=lin(r);g=lin(g);b=lin(b);const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;const x=f((.4124*r+.3576*g+.1805*b)/.95047),y=f(.2126*r+.7152*g+.0722*b),z=f((.0193*r+.1192*g+.9505*b)/1.08883);return[116*y-16,500*(x-y),200*(y-z)]}
function lab2rgb([L,a,b]){let y=(L+16)/116,x=a/500+y,z=y-b/200;const f=t=>t**3>.008856?t**3:(t-16/116)/7.787;x=f(x)*.95047;y=f(y);z=f(z)*1.08883;const gm=v=>255*(v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055);return[3.2406*x-1.5372*y-.4986*z,-.9689*x+1.8758*y+.0415*z,.0557*x-.204*y+1.057*z].map(gm)}

 <div class="sw"><button class="${LS.sel?'':'on'}" data-act="nolip" style="background:linear-gradient(135deg,#fff 45%,#d33 45% 55%,#fff 55%)" aria-label="No color"></button>${L.map(s=>`<button class="${LS.sel===s?'on':''}" style="background:${s.hex}" data-act="pickl" data-id="${s.id}" title="${s.name}" aria-label="${s.name}"></button>`).join('')}</div>
 <h2>2 · See it on every natural lip shade</h2><div class="row"><select id="lv"><option value="own">Shade's own finish</option><option>matte</option><option>satin</option><option>gloss</option></select><label>Intensity <input type="range" id="li" min="20" max="100" value="${LS.inten*100}"></label><button class="btn s" id="hold">Hold: before</button></div>
 <div class="lg">${LN.map((n,i)=>`<figure data-nat="${i}" class="${i===LS.nat?'on':''}"><canvas></canvas><figcaption>${n}</figcaption></figure>`).join('')}</div><div id="ld"></div>`;
 $('#lb').onchange=e=>{LS.brand=e.target.value;LS.sel=null;vLips()};$('#lf').value=LS.fin;$('#lf').onchange=e=>{LS.fin=e.target.value;vLips()};$('#lv').value=LS.view;$('#lv').onchange=e=>{LS.view=e.target.value;lipRender()};$('#li').oninput=e=>{LS.inten=e.target.value/100;lipRender()};
 const h=$('#hold');h.onpointerdown=()=>{LS.before=true;lipRender()};['pointerup','pointerleave'].forEach(v=>h.addEventListener(v,()=>{if(LS.before){LS.before=false;lipRender()}}));lipRender()}
function lipRender(){const cs=document.querySelectorAll('.lg canvas'),s=LS.sel,fin=s?(LS.view==='own'?s.finish:LS.view):'matte';cs.forEach((c,i)=>LT[i]&&paint(LT[i],c,s&&!LS.before?s.hex:null,fin,LS.inten));lipDetail()}
function lipDetail(){const d=$('#ld');if(!d||!LT[LS.nat])return;const t=LT[LS.nat],s=LS.sel,fi=$('#lf')?.value||'',pool=LP.filter(x=>!fi||x.finish===fi),top=pool.slice().sort((a,b)=>dE(t.lab,a.lab)-dE(t.lab,b.lab)).slice(0,5);
 d.innerHTML=(s?`<div class="card" style="margin:12px 0;animation:none"><b>${s.brand} · ${s.name}</b> <span class="tg">${money(s.price)}</span><div class="lg" style="margin:8px 0">${['matte','satin','gloss'].map(f=>`<figure><canvas data-f="${f}"></canvas><figcaption>${f}${f===s.finish?' ✓':''}</figcaption></figure>`).join('')}</div>${meter(t.lab,[s,...top.filter(x=>x!==s)],'Your lips','Lipstick')}<button class="btn s" data-act="favs" data-id="${s.id}">♡ Save</button></div>`:'')+`<h2>Closest to ${LN[LS.nat]} lips</h2>`+top.map(x=>{const dd=dE(t.lab,x.lab),[l,c]=lbl(dd);return `<div class="card row" style="animation:none;cursor:pointer" data-act="pickl" data-id="${x.id}"><i style="width:28px;height:28px;border-radius:50%;background:${x.hex}"></i><span style="flex:1">${x.brand} · ${x.name}<br><small>${x.finish} · ${money(x.price)}</small></span><b>${pct(dd)}% Match</b></div>`}).join('');
 d.querySelectorAll('canvas[data-f]').forEach(c=>paint(t,c,s.hex,c.dataset.f,LS.inten));countUp()}
TILES.forEach((src,i)=>{const im=new Image();im.onload=()=>{LT[i]=prepTile(im);if(tab==='lips')lipRender()};im.src=src});
/* ===== bag ===== */
function drawer(open){const d=$('#dr'),sub=bag.reduce((s,x)=>s+x.p.price*x.q,0),left=Math.max(0,35-sub);
 d.innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Bag</h2><button class="ib" data-act="close" aria-label="Close">✕</button></div><div class="bar"><i style="width:${Math.min(100,sub/35*100)}%"></i></div><small>${left?`Add ${money(left)} more for free shipping`:'You get free shipping'}</small>
 ${bag.map((x,i)=>`<div class="row"><div style="width:48px;height:48px;border-radius:8px;background:var(--soft);display:grid;place-items:center">${art(x.p,x.s.hex).replace('<svg','<svg width="28"')}</div><span style="flex:1;font-size:13px">${x.p.brand} ${x.p.name}<br><small>${x.s.name}</small></span><button class="pill" data-act="q" data-i="${i}" data-d="-1">−</button>${x.q}<button class="pill" data-act="q" data-i="${i}" data-d="1">+</button></div>`).join('')||'<p>Your bag is empty.</p>'}
 <h3>Subtotal ${money(sub)}</h3><button class="btn" style="width:100%" data-act="co">Checkout</button>`;if(open!==undefined)d.classList.toggle('open',open)}
/* ===== events ===== */
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);const a=e.target.closest('[data-act]');if(!a)return;const D=a.dataset,p=PM[D.p];
 ({bag:()=>drawer(true),close:()=>drawer(false),fav:()=>{const s=p.shades[p.sel];toggleFav({id:p.id,t:p.name,brand:p.brand,hex:s.hex,p:p.price});a.classList.toggle('on');a.textContent=isFav(p.id)?'♥':'♡'},unfav:()=>{fav=fav.filter(f=>f.id!==D.p);saveFav();badges();vSaved()},
 favs:()=>{const s=MAP[D.id];toggleFav({id:s.id,t:s.name,brand:s.brand,hex:s.hex,p:s.price})},
 add:()=>{const s=p.shades[p.sel],f=bag.find(x=>x.p===p&&x.s===s);f?f.q++:bag.push({p,s,q:1});badges();drawer();toast('Added to bag')},
 q:()=>{bag[D.i].q+=+D.d;if(bag[D.i].q<1)bag.splice(D.i,1);badges();drawer()},co:()=>{bag=[];badges();drawer();toast('Order placed (demo)')},
 sh:()=>{p.sel=+D.s;const c=a.closest('.card');c.outerHTML=card(p).replace('animation-delay','x');},brand:()=>{flt={q:'',brand:D.b,type:'',sort:'pop'};page=1;go('shop')},type:()=>{flt.type=D.t;page=1;vShop()},more:()=>{page++;fillShop()},
 open:()=>{const sc=(q)=>setTimeout(()=>$(q)?.scrollIntoView({behavior:'smooth'}),120);if(p.type==='foundation'){const s=p.shades[p.sel];F.brand=p.brand;F.keep=true;F.lab=s.lab;F.ref=p.brand+' '+s.name;go('foundation');toast('Showing matches for '+s.name);sc('#fr')}else{const s=p.shades[p.sel];LS.brand=p.brand;LS.fin=s.finish;LS.sel=s;go('lips');toast(s.name+' on natural lips');sc('.lg')}},nolip:()=>{LS.sel=null;vLips()},pickl:()=>{LS.sel=MAP[D.id];if(LS.brand!==LS.sel.brand)LS.brand=LS.sel.brand;vLips()}})[D.act]?.()});
document.addEventListener('click',e=>{const f=e.target.closest('figure[data-nat]');if(f){LS.nat=+f.dataset.nat;document.querySelectorAll('.lg figure[data-nat]').forEach(x=>x.classList.toggle('on',x===f));lipDetail()}});
const hay=p=>(p.brand+' '+p.name+' '+p.type+' '+(p.type==='lips'?'lipstick lip gloss ':'')+p.shades.map(s=>s.name+' '+(s.finish||'')).join(' ')).toLowerCase(),ph=p=>p._h||(p._h=hay(p));
const qEl=$('#q'),sg=$('#sug'),qx=$('#qx'),words=v=>v.trim().toLowerCase().split(/\s+/).filter(Boolean);
function suggest(v){const ws=words(v);if(!ws.length){sg.hidden=true;return}const all=(s)=>ws.every(w=>s.includes(w)),
 b=BR.filter(x=>all(x.toLowerCase())).slice(0,3).map(x=>['Brand',x]),pr=[...new Set(PRODS.filter(p=>all(ph(p))).map(p=>p.brand+' '+p.name))].slice(0,4).map(x=>['Product',x]),sh=[...new Set(FD.concat(LP).filter(s=>all((s.brand+' '+s.name).toLowerCase())).map(s=>s.brand+' '+s.name))].slice(0,3).map(x=>['Shade',x]);
 const m=[...b,...pr,...sh];sg.innerHTML=m.map(([k,x])=>`<div data-v="${x.replace(/"/g,'&quot;')}"><small style="color:var(--mu)">${k}</small> ${x}</div>`).join('')||'<div style="color:var(--mu)">No matches</div>';sg.hidden=false}
function submitQ(v){sg.hidden=true;flt.q=v.trim();flt.brand='';flt.type='';page=1;go('shop')}
qEl.oninput=e=>{const v=e.target.value;qx.hidden=!v;flt.q=v.trim();suggest(v);if(tab==='shop'){page=1;fillShop()}};
qEl.onfocus=()=>qEl.value&&suggest(qEl.value);
qEl.onkeydown=e=>{if(e.key==='Enter')submitQ(qEl.value);if(e.key==='Escape')sg.hidden=true};
sg.onclick=e=>{const d=e.target.closest('[data-v]');if(!d)return;qEl.value=d.dataset.v;qx.hidden=false;submitQ(d.dataset.v)};
$('#qi').onclick=()=>submitQ(qEl.value);
qx.onclick=()=>{qEl.value='';qx.hidden=true;sg.hidden=true;flt.q='';qEl.focus();if(tab==='shop'){page=1;fillShop()}};
document.addEventListener('click',e=>{if(!e.target.closest('.search'))sg.hidden=true});
badges();drawer();go('home');tdInit();
</script></body></html>
